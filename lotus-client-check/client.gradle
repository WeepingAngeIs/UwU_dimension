gradle.beforeProject { project ->
    project.plugins.withId('net.neoforged.moddev') {
        def probe = project.sourceSets.create('lotusClientCheck')
        probe.java.srcDirs = [project.file('lotus-client-check/java')]
        probe.resources.srcDirs = [project.file('lotus-client-check/resources')]
        probe.compileClasspath += project.sourceSets.main.compileClasspath + project.sourceSets.main.output
        project.dependencies.add('runtimeOnly', project.fileTree('build/lotus-client-deps') { include '*.jar' })
        project.neoForge.mods.create('uwu_lotus_client_check') { sourceSet(probe) }
        project.neoForge.runs.create('lotusClient') {
            client()
            def dirkCountdown = System.getenv('UWU_DIRK_COUNTDOWN_CHECK') == 'true'
            def shrineCheck = System.getenv('UWU_SHRINE_CLIENT_CHECK') == 'true'
            def cupidLantern = System.getenv('UWU_CUPID_LANTERN_CHECK') == 'true'
            gameDirectory = project.file(cupidLantern ? 'build/cupid-lantern-client' : shrineCheck ? 'build/shrine-client' :
                    (dirkCountdown ? 'build/dirk-countdown-client' : 'build/lotus-client'))
            jvmArgument('-Xmx3G')
            if (dirkCountdown) jvmArgument('-Duwu.check.dirkCountdown=true')
            if (shrineCheck) jvmArgument('-Duwu.check.shrine=true')
            if (cupidLantern) {
                jvmArgument('-Duwu.check.cupidLantern=true')
                jvmArgument('-Duwu.check.evidence=' + project.file('build/cupid-lantern-evidence').absolutePath)
            }
            if (System.getenv('UWU_DECOR_CHECK') == 'true') jvmArgument('-Duwu.check.decor=true')
        }
    }
}
