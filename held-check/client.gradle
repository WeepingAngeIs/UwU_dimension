gradle.beforeProject { project ->
    project.plugins.withId('net.neoforged.moddev') {
        def probe = project.sourceSets.create('gripCheck')
        probe.java.srcDirs = [project.file('held-check/java')]
        probe.resources.srcDirs = [project.file('held-check/resources')]
        probe.compileClasspath += project.sourceSets.main.compileClasspath + project.sourceSets.main.output
        project.dependencies.add('runtimeOnly', project.fileTree('build/grip-deps') { include '*.jar' })
        project.neoForge.mods.create('uwu_grip_check') { sourceSet(probe) }
        project.neoForge.runs.create('gripClient') {
            client()
            gameDirectory = project.file('build/grip-client')
            jvmArgument('-Xmx3G')
        }
    }
}
