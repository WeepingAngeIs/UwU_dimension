name: UwU Dimension Returnbloom Dirk countdown
on:
  push:
    branches: ['codex/integration/uwu-dirk-countdown']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'WeepingAngeIs/UwU_dimension' && !github.event.repository.private
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      UWU_DIRK_COUNTDOWN_CHECK: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare the disposable client display
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! dpkg-query -W libgl1-mesa-dri libopenal1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb xauth libgl1-mesa-dri libopenal1
          fi
      - name: Observe the native Dirk countdown and first-person pose
        run: bash lotus-client-check/run.sh
