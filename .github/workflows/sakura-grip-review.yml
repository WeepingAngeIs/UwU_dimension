name: Sakura hand grip review
on:
  push:
    branches: [review/sakura-grips-pass-1, review/sakura-snowkiss-grip, review/sakura-bellheart-grip]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: grip-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  photographs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after, native-before, native-after]
    env:
      WISH_COMBAT: bettercombat
      UWU_GRIP_VARIANT: ${{ matrix.variant }}
      UWU_GRIP_ITEM: ${{ github.ref_name == 'review/sakura-bellheart-grip' && 'bellheart_axe' || github.ref_name == 'review/sakura-snowkiss-grip' && 'frost_whip' || '' }}
      UWU_GRIP_BASE: ${{ github.ref_name == 'review/sakura-bellheart-grip' && '8de4ceecbd758869e7700447dacce1b3957e8648' || github.ref_name == 'review/sakura-snowkiss-grip' && '3ce8cca4a6e8337760d9c2b70bc62a59a5be486c' || 'b439443' }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Use the matching baseline production code on the before server
        if: endsWith(matrix.variant, 'before')
        run: git restore --source="$UWU_GRIP_BASE" --worktree -- src/main
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1 iproute2 xdotool
      - name: Photograph the review and publish the first matched angles
        shell: bash
        run: |
          (set +e; bash ci/weapon-polish-network.sh; echo $? > "$RUNNER_TEMP/grip-exit") > "$RUNNER_TEMP/grip.log" 2>&1 < /dev/null &
          world=build/weapon-polish-network
          until [[ -f "$world/sync/grip-first-complete" ]]; do
            if [[ -f "$RUNNER_TEMP/grip-exit" ]]; then tail -80 "$RUNNER_TEMP/grip.log"; exit 1; fi
            sleep 2
          done
          mkdir -p build/grip-first
          find "$world" -path '*/screenshots/*' -type f \( -name '*rest.png' -o -name '*attack-07.png' \) -exec cp '{}' build/grip-first/ ';'
      - uses: actions/upload-artifact@v4
        with:
          name: initial-${{ matrix.variant }}
          path: build/grip-first/*.png
      - name: Complete the requested angles and attack sequences
        shell: bash
        run: |
          until [[ -f "$RUNNER_TEMP/grip-exit" ]]; do sleep 2; done
          tail -35 "$RUNNER_TEMP/grip.log"
          exit "$(cat "$RUNNER_TEMP/grip-exit")"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grip-${{ matrix.variant }}
          path: |
            build/weapon-polish-network/*.log
            build/weapon-polish-network/sync/grip.properties
            build/weapon-polish-network/sync/*-status.txt
            build/weapon-polish-network/archer/run-archer/screenshots
            build/weapon-polish-network/witness/run-witness/screenshots
            build/weapon-polish-network/crash-reports

