name: Sakura weapon polish beta13
on:
  push:
    branches: [feature/sakura-weapon-polish-beta13]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: sakura-weapon-polish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ci/get-mods.sh
      - run: ./gradlew jar expeditionJar
      - uses: actions/upload-artifact@v4
        with:
          name: weapon-polish-compiled
          path: build/libs/*.jar
