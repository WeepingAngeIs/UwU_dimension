name: Sakura activity achievements
on:
  push:
    branches: [feature/sakura-achievements]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: sakura-activities-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: {world: [fresh, upgrade]}
    env: {ACTIVITY_WORLD: '${{ matrix.world }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ci/activity-proof.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activity-server-${{ matrix.world }}
          path: |
            build/libs/*.jar
            build/activity-server/first.log
            build/activity-server/restart.log
            build/activity-server/baseline.log
            build/activity-server/activity-old-progress.json
            build/activity-server/world/advancements
            build/activity-server/crash-reports
  cupid:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env: {WISH_COMBAT: bettercombat, UWU_ACTIVITY_TEST: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1 iproute2 xdotool
      - run: bash ci/wish-network.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activity-cupid
          path: |
            build/libs/*.jar
            build/wish-network/server.log
            build/wish-network/archer.log
            build/wish-network/witness.log
            build/wish-network/sync
            build/wish-network/world/advancements
            build/wish-network/archer/run-archer/screenshots
            build/wish-network/archer/run-archer/crash-reports
            build/wish-network/witness/run-witness/crash-reports
  giant:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env: {UWU_FIELD_SEED: '152045', UWU_SOURCE_WORLD: fresh, UWU_ACTIVITY_TEST: '1'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - run: bash ci/forest-proof.sh
      - run: grep -F 'ACTIVITY GIANT PASS' build/forest-server/forest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activity-giant
          path: |
            build/libs/*.jar
            build/forest-server/forest.log
            build/forest-server/restart.log
            build/forest-server/world/advancements
            build/forest-server/crash-reports
