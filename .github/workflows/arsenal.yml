name: UwU counter arsenal
on:
  push:
    branches: [feature/counter-arsenal-1.2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arsenal-${{ github.ref }}-${{ contains(github.event.head_commit.message, 'server-only') }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: UwU-Dimension-1.2.0
          path: build/libs/*.jar
      - name: Exercise installed counters and ranged weapons on hosted Minecraft
        run: bash ci/counter-expedition.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counter-server-evidence
          path: |
            build/counter-server/counter.log
            build/counter-server/logs/latest.log
            build/counter-server/crash-reports
  client:
    if: ${{ !contains(github.event.head_commit.message, 'server-only') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UWU_VISIT: arsenal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1
      - name: Inspect rendered whips, scythes and glitch forms
        run: |
          set -euo pipefail
          bash ci/get-mods.sh
          mkdir -p run/config
          printf 'onboardAccessibility:false\nrenderDistance:4\nsimulationDistance:4\npauseOnLostFocus:false\n' > run/options.txt
          printf 'earlyWindowControl = false\n' > run/config/fml.toml
          export LIBGL_ALWAYS_SOFTWARE=1 ALSOFT_DRIVERS=null JAVA_TOOL_OPTIONS=-Xmx4G
          timeout 20m xvfb-run -a -s '-screen 0 1280x800x24' ./gradlew -PfieldCamera runClient | tee arsenal-client.log
          grep -F 'UWU ARSENAL CLIENT PASSED' arsenal-client.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counter-client-evidence
          path: |
            run/screenshots
            run/logs/latest.log
            run/crash-reports
            arsenal-client.log
