name: UwU counter arsenal
on:
  push:
    branches: [feature/counter-arsenal-1.2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arsenal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: UwU-Dimension-1.2.0
          path: build/libs/*.jar
      - name: Exercise installed counters and ranged weapons on hosted Minecraft
        run: bash ci/counter-expedition.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: counter-server-evidence
          path: |
            build/counter-server/counter.log
            build/counter-server/logs/latest.log
            build/counter-server/crash-reports
