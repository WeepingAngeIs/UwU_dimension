name: Sakura Glitch and guardian safety
on:
  push:
    branches: [feature/sakura-glitch-guardian]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sakura-glitch-guardian-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guardian-creeper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Test natural creeper AI and gamerule persistence on hosted servers
        run: ./gradlew jar && bash ci/guardian-creeper-proof.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardian-creeper-evidence
          path: |
            build/guardian-creeper-server/creeper-*.log
            build/guardian-creeper-server/logs/latest.log
            build/guardian-creeper-server/crash-reports/
