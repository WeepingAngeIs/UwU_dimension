name: UwU resident protection
on:
  push:
    branches: [feature/keepers-guardians-1.2.1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: residents-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: UwU-Dimension-1.2.1
          path: build/libs/*.jar
