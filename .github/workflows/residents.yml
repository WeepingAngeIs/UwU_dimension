name: UwU resident protection
on:
  push:
    branches: [feature/keepers-guardians-1.2.1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: residents-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: UwU-Dimension-1.2.1
          path: build/libs/*.jar
      - name: Verify residents and natural guardian defense on hosted Minecraft
        run: bash ci/resident-expedition.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resident-protection-evidence
          path: |
            build/resident-server/*.log
            build/resident-server/resident-checkpoint.properties
            build/resident-server/logs/latest.log
            build/resident-server/crash-reports
