name: UwU Dimension 1.1 expedition
on:
  push:
    branches: [feature/blossom-villages-1.1, main]
  workflow_dispatch:
concurrency:
  group: expedition-${{ github.sha }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        seed: [152045, 4372191]
    env:
      UWU_FIELD_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        if: matrix.seed == 152045
        with:
          name: UwU-Dimension-1.1.0
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Run the packaged mod with Cobblemon and Lootr in a fresh world
        run: |
          bash ci/thread-samples.sh build/thread-samples &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          bash ci/expedition.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: expedition-log-${{ matrix.seed }}
          path: |
            build/thread-samples
            build/field-server/expedition.log
            build/field-server/mirror-restart.log
            build/field-server/logs/latest.log
            build/field-server/crash-reports
          if-no-files-found: ignore
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        seed: [152045, 4372191]
        visit: [land, sea]
    env:
      UWU_VISIT: ${{ matrix.visit }}
      UWU_FIELD_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Visit UwU Dimension in the Minecraft client
        run: |
          set -euo pipefail
          bash ci/get-mods.sh
          mkdir -p run/config/cobblemon/spawning
          cp ci/natural-spawning.json run/config/cobblemon/main.json
          cp ci/pack-spawning.json run/config/cobblemon/spawning/best-spawner-config.json
          printf 'onboardAccessibility:false\nrenderDistance:10\nsimulationDistance:5\npauseOnLostFocus:false\n' > run/options.txt
          printf 'earlyWindowControl = false\n' > run/config/fml.toml
          export LIBGL_ALWAYS_SOFTWARE=1 ALSOFT_DRIVERS=null
          bash ci/thread-samples.sh run/thread-samples &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          timeout 22m xvfb-run -a -s '-screen 0 1280x800x24' ./gradlew -PfieldCamera runClient | tee client-visit.log
          grep -F 'HEARTWATER CLIENT ROUND TRIP PASSED' client-visit.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-field-visit-${{ matrix.seed }}-${{ matrix.visit }}
          path: |
            run/thread-samples
            run/screenshots
            run/logs/latest.log
            run/crash-reports
            client-visit.log
          if-no-files-found: warn
