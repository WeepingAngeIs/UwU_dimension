name: UwU music guardian and acquisition controls
on:
  push:
    branches: [feature/music-guardian-controls-1.2.3]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: controls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: UwU-Dimension-1.2.3
          path: build/libs/*.jar
