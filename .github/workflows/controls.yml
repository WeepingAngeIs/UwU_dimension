name: UwU music guardian and acquisition controls
on:
  push:
    branches: [feature/music-guardian-controls-1.2.3]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: controls-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: UwU-Dimension-1.2.3
          path: build/libs/*.jar
      - name: Verify server controls and guardian vitality
        run: bash ci/controls-expedition.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controls-server-evidence
          path: |
            build/resident-server/controls.log
            build/resident-server/logs/latest.log
            build/resident-server/crash-reports
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UWU_VISIT: controls
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1
      - name: Verify real client music conditions
        run: |
          set -euo pipefail
          bash ci/get-mods.sh
          mkdir -p run/config
          printf 'onboardAccessibility:false\ntutorialStep:none\nrenderDistance:4\nsimulationDistance:4\npauseOnLostFocus:false\n' > run/options.txt
          printf 'earlyWindowControl = false\n' > run/config/fml.toml
          export LIBGL_ALWAYS_SOFTWARE=1 ALSOFT_DRIVERS=null JAVA_TOOL_OPTIONS=-Xmx4G
          timeout 8m xvfb-run -a -s '-screen 0 1280x800x24' ./gradlew -PfieldCamera runClient | tee controls-client.log
          grep -F 'UWU MUSIC CLIENT PASSED' controls-client.log
          ! grep -E 'moved too quickly|moved wrongly|kicked for floating' run/logs/latest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controls-client-evidence
          path: |
            run/screenshots
            run/logs/latest.log
            run/crash-reports
            controls-client.log
