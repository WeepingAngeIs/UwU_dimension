name: UwU Dimension RC.1 JAR delivery

on:
  push:
    branches:
      - 'codex/build/uwu-rc-1-0ca52217baed-delivery'

permissions:
  contents: read

jobs:
  compile:
    if: >-
      github.repository == 'WeepingAngeIs/UwU_dimension' &&
      toJSON(github.event.repository.private) == 'false' &&
      github.ref == 'refs/heads/codex/build/uwu-rc-1-0ca52217baed-delivery' &&
      github.event.created &&
      !github.event.deleted &&
      github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate the requested revision
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          if [[ ! "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Enter the full lowercase Git commit SHA." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the checkout matches the requested commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          actual_commit="$(git rev-parse HEAD)"
          if [[ "$actual_commit" != "$EXPECTED_COMMIT" ]]; then
            echo "Checkout revision did not match the requested commit." >&2
            exit 1
          fi
          echo "Compiling $actual_commit from the frozen UwU RC.1 source 0ca52217baed27c7fc130aebaf2bc77489958a9c"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Package the complete mod
        shell: bash
        run: bash ./gradlew --no-daemon --no-build-cache --max-workers=2 jar
      - name: Verify the packaged mod
        id: jar
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import tomllib
          import zipfile

          metadata_path = "META-INF/neoforge.mods.toml"
          source_metadata = tomllib.loads(Path("src/main/resources", metadata_path).read_text(encoding="utf-8"))
          version = next(mod["version"] for mod in source_metadata["mods"] if mod["modId"] == "uwudimension")
          if version != "1.5.0-beta.13-combined-rc.1":
              raise SystemExit("Unexpected RC.1 mod version.")
          jar = Path("build/libs", "UwU-Dimension-1.21.1-1.5.0-beta.13-combined-rc.1.jar")
          if jar.stat().st_size > 8 * 1024 * 1024:
              raise SystemExit("RC.1 JAR exceeds the 8 MiB delivery bound.")
          required = {
              "dev/uwu/dimension/UwUDimension.class",
              "dev/uwu/dimension/HeartwaterFeature.class",
              "dev/uwu/dimension/lush/LushGeodes.class",
              "dev/uwu/dimension/client/ReachLiquidArt.class",
              "dev/uwu/dimension/client/compat/ReachLiquidSodiumPlugin.class",
              "dev/uwu/dimension/mixin/ReachLiquidVanillaMixin.class",
              "uwudimension.reach_liquid_sodium.mixins.json",
              "assets/uwudimension/textures/block/uwu_cave/water_still.png",
              "assets/uwudimension/textures/block/uwu_cave/lava_flow.png",
              "dev/uwu/dimension/SilkwoodDrawerBlockEntity.class",
              "dev/uwu/dimension/SilkwoodShelfBlockEntity.class",
              "dev/uwu/dimension/SilkwoodFlowerBoxBlockEntity.class",
              "dev/uwu/dimension/SakuraMaterials.class",
              "dev/uwu/dimension/mixin/SakuraPaletteMixin.class",
              "assets/uwudimension/textures/block/uwu_cave/bedrock.png",
              "assets/uwudimension/models/item/heartbriar_shield_body.obj",
              "assets/uwudimension/models/item/heartwater_window_shield_body.obj",
              "assets/uwudimension/models/item/petalfold_shield_body.obj",
              "dev/uwu/dimension/GeneratedRewardPlacement.class",
              "dev/uwu/dimension/SakuraAmbientDialogue.class",
              "dev/uwu/dimension/DawnpetalAbilities.class",
              "dev/uwu/dimension/DawnpetalSpinCue.class",
              "dev/uwu/dimension/client/DawnpetalSpinAnimator.class",
              "dev/uwu/dimension/lush/client/LushCaveModels.class",
              "dev/uwu/dimension/mixin/DawnpetalHeldModelMixin.class",
              "dev/uwu/dimension/mixin/LushGeodeRollbackMixin.class",
              "dev/uwu/dimension/mixin/LushGeodeSnapshotMixin.class",
              "assets/uwudimension/player_animations/dawnpetal_spin.json",
              "assets/uwudimension/player_animations/dawnpetal_spin_left.json",
              "assets/uwudimension/textures/block/uwu_cave/geode/pink_cluster.png",
              "assets/uwudimension/textures/block/uwu_cave/geode/silver_cluster.png",
              metadata_path,
              "uwudimension.mixins.json",
          }
          with zipfile.ZipFile(jar) as archive:
              corrupt_entry = archive.testzip()
              if corrupt_entry:
                  raise SystemExit(f"Corrupt JAR entry: {corrupt_entry}")
              missing = required.difference(archive.namelist())
              if missing:
                  raise SystemExit(f"Incomplete JAR: {', '.join(sorted(missing))}")
              resource_dir = Path("src/main/resources")
              for path in sorted(resource_dir.rglob("*")):
                  if not path.is_file():
                      continue
                  entry = path.relative_to(resource_dir).as_posix()
                  if archive.read(entry) != path.read_bytes():
                      raise SystemExit(f"Packaged resource differs from checked-out source: {entry}")
              metadata = tomllib.loads(archive.read(metadata_path).decode("utf-8"))
              if not any(mod["modId"] == "uwudimension" and mod["version"] == version for mod in metadata["mods"]):
                  raise SystemExit("Packaged mod version does not match the checked-out source.")
              dependencies = metadata["dependencies"]["uwudimension"]
              required_mods = {entry["modId"]: entry["versionRange"] for entry in dependencies if entry["type"] == "required"}
              if required_mods != {
                  "minecraft": "[1.21.1]",
                  "neoforge": "[21.1.249,21.2)",
                  "lootr": "[1.21.1-1.11.38.125,1.21.2)",
                  "another_furniture": "[4.0.2]",
              }:
                  raise SystemExit("The packaged required dependency set differs from RC.1.")
              sodium = {"config": "uwudimension.reach_liquid_sodium.mixins.json", "requiredMods": ["sodium"]}
              if sodium not in metadata["mixins"]:
                  raise SystemExit("The optional Sodium liquid declaration is missing.")
              mixins = json.loads(archive.read("uwudimension.mixins.json"))
              if not {"LushGeodeSnapshotMixin", "LushGeodeRollbackMixin"}.issubset(mixins["mixins"]):
                  raise SystemExit("Geode rollback mixins are missing from the packaged configuration.")
              if "DawnpetalHeldModelMixin" not in mixins["client"]:
                  raise SystemExit("The Dawnpetal held-model mixin is missing from the packaged configuration.")

          revision = os.environ["EXPECTED_COMMIT"]
          digest = hashlib.sha256(jar.read_bytes()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as outputs:
              print(f"sha256={digest}", file=outputs)
          report = (
              f"### UwU Dimension RC.1\n\n"
              f"Source commit: `0ca52217baed27c7fc130aebaf2bc77489958a9c`\n\n"
              f"Published snapshot: `{revision}`\n\n"
              f"JAR: `{jar.name}`\n\n"
              f"SHA-256: `{digest}`\n\n"
              "Checks passed: JAR integrity, required classes and assets, resource byte parity, "
              "mod version, required dependencies and mixin declarations.\n"
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(report)
          print(report)
          PY
      - name: Retain the single verified RC.1 JAR for one day
        id: delivery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: build/libs/UwU-Dimension-1.21.1-1.5.0-beta.13-combined-rc.1.jar
          retention-days: 1
          archive: false
          if-no-files-found: error
      - name: Verify the uploaded JAR digest and record its link
        env:
          ARTIFACT_URL: ${{ steps.delivery.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.delivery.outputs.artifact-digest }}
          JAR_SHA256: ${{ steps.jar.outputs.sha256 }}
        shell: bash
        run: |
          if [[ -z "$ARTIFACT_URL" ]]; then
            echo "GitHub did not return an artifact download URL." >&2
            exit 1
          fi
          if [[ -z "$JAR_SHA256" || "${ARTIFACT_DIGEST#sha256:}" != "$JAR_SHA256" ]]; then
            echo "GitHub artifact digest did not match the verified JAR." >&2
            exit 1
          fi
          printf '\n[Download the verified RC.1 artifact](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
