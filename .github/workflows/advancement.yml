name: UwU realm entry advancement
on:
  push:
    branches: [feature/realm-entry-advancement-1.2.4]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build versioned mod
        run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: UwU-Dimension-1.2.4
          path: build/libs/*.jar
      - name: Check native realm entry criteria on NeoForge server
        run: bash ci/advancement-expedition.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: advancement-server-evidence
          path: |
            build/advancement-server/advancement.log
            build/advancement-server/logs/latest.log
            build/advancement-server/crash-reports
