name: Sakura weapon roster evidence
on:
  push:
    branches: [feature/sakura-roster-art]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sakura-roster-${{ github.ref }}
  cancel-in-progress: true
jobs:
  counter-server:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew jar && python3 ci/verify-roster-assets.py build/libs/UwU-Dimension-*.jar && bash ci/counter-expedition.sh
      - run: |
          grep -F 'UWU LEGACY ROSTER PASS' build/counter-server/counter.log
          grep -F 'UWU RETUNING PASS 133 targets in both hands' build/counter-server/counter.log
          grep -F 'COUNTER ROSTER PASS 133 normal casts' build/counter-server/counter.log
          grep -F 'GLITCH PASS 180' build/counter-server/counter.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roster-server-evidence
          path: |
            build/counter-server/counter.log
            build/counter-server/logs/latest.log
            build/counter-server/crash-reports
  better-combat:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew jar && bash ci/bettercombat-proof.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roster-better-combat-evidence
          path: |
            build/renewal-server/first.log
            build/renewal-server/crash-reports
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env: {UWU_VISIT: roster}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1
      - name: Capture every obtainable and retunable item in the actual Minecraft renderer
        run: |
          set -euo pipefail
          bash ci/get-mods.sh
          mkdir -p run/config
          printf 'guiScale:2\nonboardAccessibility:false\ntutorialStep:none\nrenderDistance:4\nsimulationDistance:4\npauseOnLostFocus:false\n' > run/options.txt
          printf 'earlyWindowControl = false\n' > run/config/fml.toml
          export LIBGL_ALWAYS_SOFTWARE=1 ALSOFT_DRIVERS=null JAVA_TOOL_OPTIONS=-Xmx4G
          timeout 25m xvfb-run -a -s '-screen 0 1280x800x24' ./gradlew -PfieldCamera runClient | tee roster-gallery.log
          grep -F 'UWU ROSTER CLIENT PASSED items=151 pages=10' roster-gallery.log
          test "$(find run/screenshots -name 'roster-gallery-*.png' | wc -l)" -eq 10
          grep 'ROSTER GALLERY ITEM ' roster-gallery.log > roster-manifest.txt
          test "$(wc -l < roster-manifest.txt)" -eq 151
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roster-gallery
          path: |
            run/screenshots/roster-gallery-*.png
            roster-manifest.txt
            roster-gallery.log
            run/logs/latest.log
            run/crash-reports
  poses:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env: {UWU_VISIT: arsenal}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1
      - name: Photograph representative first and third person held, draw and flight poses
        run: |
          set -euo pipefail
          bash ci/get-mods.sh
          mkdir -p run/config
          printf 'onboardAccessibility:false\ntutorialStep:none\nrenderDistance:4\nsimulationDistance:4\npauseOnLostFocus:false\n' > run/options.txt
          printf 'earlyWindowControl = false\n' > run/config/fml.toml
          export LIBGL_ALWAYS_SOFTWARE=1 ALSOFT_DRIVERS=null JAVA_TOOL_OPTIONS=-Xmx4G
          timeout 25m xvfb-run -a -s '-screen 0 1280x800x24' ./gradlew -PfieldCamera runClient | tee arsenal-client.log
          grep -F 'UWU ARSENAL CLIENT PASSED' arsenal-client.log
          for weapon in twinfin-lash frost-lash dusk-element-wave spinning-scythe glitch-static; do
            for view in first third; do test -s "run/screenshots/$weapon-held-$view.png"; done
          done
          for weapon in spinning-scythe glitch-static; do
            for view in first third; do test -s "run/screenshots/$weapon-draw-$view.png"; done
          done
          for weapon in dusk-element-wave spinning-scythe; do test -s "run/screenshots/$weapon-flight-third.png"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roster-pose-evidence
          path: |
            run/screenshots/*.png
            arsenal-client.log
            run/logs/latest.log
            run/crash-reports
