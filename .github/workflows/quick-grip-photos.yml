name: Quick grip photos
on:
  push:
    branches: [review/sakura-grips-quick-photo]
permissions: {contents: read}
jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env: {WISH_COMBAT: bettercombat}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1 iproute2 xdotool
      - run: bash ci/weapon-polish-network.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-grip-photos
          path: |
            build/weapon-polish-network/*.log
            build/weapon-polish-network/sync
            build/weapon-polish-network/archer/run-archer/screenshots
            build/weapon-polish-network/witness/run-witness/screenshots
            build/weapon-polish-network/crash-reports
            build/weapon-polish-network/archer/run-archer/crash-reports
            build/weapon-polish-network/witness/run-witness/crash-reports
