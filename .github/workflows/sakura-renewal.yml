name: Sakura Reach renewal
on:
  push:
    branches: [feature/sakura-renewal]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sakura-renewal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: UwU-Dimension-1.5.0-beta.1
          path: build/libs/*.jar
          if-no-files-found: error
