name: Sakura Reach renewal
on:
  push:
    branches: [feature/sakura-renewal, feature/sakura-art-implementation]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sakura-renewal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: ./gradlew build --stacktrace
      - run: python3 ci/renewal-assets.py build/libs/UwU-Dimension-*.jar
      - run: python3 ci/moonveil-assets.py build/libs/UwU-Dimension-*.jar
      - uses: actions/upload-artifact@v4
        with:
          name: UwU-Dimension-1.5.0-beta.3-dev
          path: build/libs/*.jar
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {seed: 152045, world: fresh}
          - {seed: 4372191, world: upgrade-1.4.9}
          - {seed: 4372191, world: upgrade-beta.1}
    timeout-minutes: 45
    env:
      UWU_FIELD_SEED: ${{ matrix.seed }}
      UWU_SOURCE_WORLD: ${{ matrix.world }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew jar && bash ci/renewal-server.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-evidence-${{ matrix.world }}
          path: |
            build/renewal-server/*.log
            build/renewal-server/first-site.txt
            build/renewal-server/old-native-dusk.txt
            build/renewal-server/guardian-family-evidence/
            build/renewal-server/guardian-family-checkpoint.properties
            build/renewal-server/crash-reports/

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      UWU_VISIT: renewal
      UWU_FIELD_SEED: 152045
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Photograph the route and both armor sets
        run: |
          set -euo pipefail
          bash ci/get-mods.sh
          mkdir -p run/config/cobblemon/spawning
          cp ci/natural-spawning.json run/config/cobblemon/main.json
          cp ci/pack-spawning.json run/config/cobblemon/spawning/best-spawner-config.json
          printf 'particles:2\nonboardAccessibility:false\ntutorialStep:none\nrenderDistance:8\nsimulationDistance:5\npauseOnLostFocus:false\n' > run/options.txt
          printf 'earlyWindowControl = false\n' > run/config/fml.toml
          export LIBGL_ALWAYS_SOFTWARE=1 ALSOFT_DRIVERS=null JAVA_TOOL_OPTIONS=-Xmx4G
          timeout 34m xvfb-run -a -s '-screen 0 1280x800x24' ./gradlew -PfieldCamera runClient | tee client-visit.log
          grep -F 'SAKURA REACH CLIENT ROUND TRIP PASSED' client-visit.log
          grep -F 'SAKURA NIGHT MUSIC PASS' client-visit.log
          grep -F 'CUPID HELD MODEL PASS' client-visit.log
          for frame in arrival armor-gallery village female-guardian cupid-{right,left}-{rest,early,middle,full} cupid-arrow-flight cupid-impact-outline blush-reef roseglass-cavern moonwake-trench sakura-night mirror-court; do test -s "run/screenshots/$frame.png"; done
          grep -F 'SAKURA PANTRY REAL ITEMS PASS' client-visit.log
          for frame in pantry-inventory-{1,2,3} pantry-tooltip-{starfruit,cake} pantry-held-{starfruit,ice-cream}; do test -s "run/screenshots/$frame.png"; done
          for frame in petal-understory dusk-understory treehouse-{petal,dusk}-{exterior,interior} owl-guardians owl-guardian-family owl-keepers owl-expression owl-eye-{open,half,closed} mistgrass-shore rainbow-riverbed crop-growth crop-detail lantern-front lantern-side relic-rack architecture-{petal-joinery,dusk-joinery,entrance,bathhouse,archive,court,shrine}; do test -s "run/screenshots/$frame.png"; done
          for frame in cupid-shoulder-{left,right}-{rest,early,middle,full} cupid-first-{rest,full}-{front,edge} cupid-third-{rest,full}-{front,side,edge}; do test -s "run/screenshots/$frame.png"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sakura-field-visit
          path: |
            run/screenshots
            run/logs/latest.log
            run/crash-reports
            client-visit.log

  multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Shoot the Cupid Bow on a dedicated server with a graphical client
        run: bash ci/cupid-network.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cupid-network-visit
          path: |
            run/screenshots
            run/logs/latest.log
            build/cupid-network/*.log
