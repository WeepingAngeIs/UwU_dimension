name: Sakura Glitch two-client synchronization
on:
  push:
    branches: [feature/sakura-glitch-guardian, feature/sakura-coding-followup]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sakura-glitch-network-${{ github.ref }}
  cancel-in-progress: true
jobs:
  two-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libopenal1
      - name: Observe a real remote throw and form change on a second client
        run: bash ci/glitch-network.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glitch-two-client-evidence
          path: |
            build/glitch-network/server.log
            build/glitch-network/shooter.log
            build/glitch-network/observer.log
            build/glitch-network/observer/run-observer/screenshots/network-glitch-*.png
            build/glitch-network/observer/run-observer/logs/latest.log
            build/glitch-network/shooter/run-shooter/logs/latest.log
            build/glitch-network/crash-reports/
