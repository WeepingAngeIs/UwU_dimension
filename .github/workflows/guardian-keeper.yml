name: UwU Dimension 1.4.9 hosted build
on:
  push:
    branches: [feature/uwu-guardian-keeper-ai-1.4.8]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-jar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Package the mod JAR
        run: ./gradlew jar --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: UwU-Dimension-1.4.9
          path: build/libs/*.jar
