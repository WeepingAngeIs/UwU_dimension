name: UwU caves and Dusk fallback checks
on:
  push:
    branches: ['codex/fallback/uwu-caves-dusk-20261121']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: uwu-caves-dusk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'WeepingAngeIs/z-UwU_dm' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      VERSION: '1.5.0-beta.13-combined-rc.2-playtest.9-caves-dusk.1'
      UWU_JAR: build/libs/UwU-Dimension-1.21.1-1.5.0-beta.13-combined-rc.2-playtest.9-caves-dusk.1.jar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '21'
      - name: Recover the verified Playtest 9 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash fallback-check/recover-baseline.sh
      - name: Build and verify the cave and Dusk edit scope
        id: build
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor e16af6a2a1a00cb68291b6c9611d4604a0b20171 HEAD
          bash ./gradlew --no-daemon --no-build-cache --max-workers=2 jar
          python3 fallback-check/verify.py "$UWU_JAR" "$RUNNER_TEMP/playtest-9.jar" "$VERSION" --classes build/classes/java/main
      - name: Check new Dusk placement and preserved Playtest 9 settlements separately
        run: bash dusk-check/run-server.sh "$UWU_JAR" "$RUNNER_TEMP/playtest-9.jar"
      - name: Check native shrine generation in both chunk orders, reload and Dusk exclusion
        env:
          UWU_SHRINE_ORDERS_ONLY: 'true'
        run: bash shrine-check/run-server.sh "$UWU_JAR"
      - name: Verify all three fixed waterfalls on fresh native terrain
        run: bash waterfall-check/run.sh "$UWU_JAR"
      - name: Prepare the disposable cave client display
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null || ! dpkg-query -W libgl1-mesa-dri libopenal1 >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb xauth libgl1-mesa-dri libopenal1
          fi
      - name: Check complete cave flora and actual UwU Berry harvesting
        env:
          UWU_CAVE_CLIENT_CHECK: 'true'
        run: bash lotus-client-check/run.sh
      - name: Record the tested source, scope and JAR digest
        id: packet
        run: |
          python3 fallback-check/verify.py "$UWU_JAR" "$RUNNER_TEMP/playtest-9.jar" "$VERSION" --classes build/classes/java/main
          python3 fallback-check/provenance.py "$UWU_JAR" "$RUNNER_TEMP/playtest-9.jar"
          echo "sha=$(sha256sum "$UWU_JAR" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Return the verified fallback test JAR
        id: deliver
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          path: ${{ env.UWU_JAR }}
          archive: false
          retention-days: 1
          if-no-files-found: error
      - name: Verify the uploaded artifact digest
        env:
          SHA: ${{ steps.packet.outputs.sha }}
          UPLOAD_SHA: ${{ steps.deliver.outputs.artifact-digest }}
        run: |
          test "$SHA" = "${UPLOAD_SHA#sha256:}"
          echo "Source SHA: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "JAR SHA256: $SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Return focused check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: uwu-caves-dusk-check-evidence-${{ github.sha }}
          path: |
            build/fallback-check/*.json
            build/fallback-check/*.patch
            build/dusk-check/*.log
            build/dusk-check/*.json
            build/shrine-check/*.log
            build/waterfall-check/*.log
            build/cave-client.log
            build/cave-client/cave-flora-palette.png
            build/cave-client/cave-flora-palette.txt
          retention-days: 3
          if-no-files-found: warn
