name: Heart shield abilities
on:
  push:
    branches: [feature/heart-shield-gifts]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: heart-shields-${{ github.ref }}
  cancel-in-progress: true
jobs:
  shield-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build shields and check real server damage
        run: bash ci/heart-shields.sh
      - uses: actions/upload-artifact@v4
        with:
          name: UwU-Dimension-heart-shields
          path: build/libs/*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heart-shield-proof
          path: |
            build/heart-shield-server/shield-server.log
            build/heart-shield-server/crash-reports/
