gradle.projectsEvaluated {
    def project = gradle.rootProject
    def compile = project.tasks.register('compileWaterfallProbe', JavaCompile) {
        source(project.fileTree('waterfall-check/java') { include '**/*.java' })
        classpath = project.sourceSets.main.compileClasspath + project.sourceSets.main.output
        destinationDirectory.set(project.layout.buildDirectory.dir('waterfall-check/classes'))
        javaCompiler.set(project.tasks.named('compileJava', JavaCompile).flatMap { it.javaCompiler })
        options.release.set(21)
    }
    project.tasks.register('waterfallProbeJar', Jar) {
        archiveFileName.set('waterfall-probe.jar')
        destinationDirectory.set(project.layout.buildDirectory.dir('waterfall-check'))
        from(compile.flatMap { it.destinationDirectory })
        from(project.file('waterfall-check/resources'))
    }
}
