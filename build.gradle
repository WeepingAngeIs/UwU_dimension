plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'dev.uwu.dimension'
version = '1.0.0'
base.archivesName = 'UwU-Dimension-1.21.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.249'
    runs { client { client() }; server { server() } }
    mods { uwudimension { sourceSet(sourceSets.main) } }
}
repositories { mavenCentral() }
dependencies { runtimeOnly fileTree(dir: 'libs', include: ['*.jar']) }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
