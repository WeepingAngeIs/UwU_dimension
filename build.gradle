plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = 'dev.uwu.dimension'
version = '1.2.7'
base.archivesName = 'UwU-Dimension-1.21.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge {
    version = '21.1.249'
    runs { client { client() }; server { server() } }
    mods { uwudimension { sourceSet(sourceSets.main) } }
}
repositories {
    mavenCentral()
    maven {
        url = uri('https://www.cursemaven.com')
        content { includeGroup('curse.maven') }
    }
}
dependencies {
    compileOnly 'curse.maven:simply-swords-659887:8746001'
    compileOnly 'curse.maven:architectury-api-419699:8492726'
    runtimeOnly fileTree(dir: 'libs', include: ['*.jar'], exclude: ['another_furniture-*.jar'])
    // Hosted clients run with the same checksum-verified file as the dedicated server.
    def furniture = file('libs/another_furniture-neoforge-4.0.2.jar')
    runtimeOnly(furniture.isFile() ? files(furniture) : 'curse.maven:another-furniture-610492:7355747')
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

sourceSets {
    expedition {
        java.srcDirs = ['ci/probe/java']
        resources.srcDirs = ['ci/probe/resources']
        compileClasspath += files('build/probe-compile/kotlin-stdlib.jar') + sourceSets.main.compileClasspath + sourceSets.main.output + fileTree('libs') { include '*.jar' }
    }
}
tasks.register('expeditionJar', Jar) {
    archiveBaseName = 'heartwater-hosted-probe'
    destinationDirectory = layout.buildDirectory.dir('expedition')
    from sourceSets.expedition.output
}

if (providers.gradleProperty('fieldCamera').isPresent()) {
    neoForge.mods { heartwater_probe { sourceSet(sourceSets.expedition) } }
}
